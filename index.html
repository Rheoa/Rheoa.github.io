<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>World Discovery — Explore Amazing Places</title>

  <!-- Globe favicon (no more 404 errors) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />

  <meta name="description" content="Discover amazing places, hidden destinations, and fascinating travel facts." />

  <!-- Google Font for a modern look -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       COLOR SCHEME: Primary Yellow #ffdb10
       ============================================================ */
    :root {
      --yellow: #ffdb10;
      --yellow-dark: #e6c200;
      --yellow-darker: #b39b00;
      --yellow-light: #fff8e1;
      --bg: #fdfdfc;
      --surface: #ffffff;
      --text: #1a1a2e;
      --muted: #5a5a72;
      --border: #eaeaea;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
      --max-width: 1200px;
      --nav-height: 68px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ============================================================
       HEADER / NAVIGATION
       ============================================================ */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--yellow);
      height: var(--nav-height);
      display: flex;
      align-items: center;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--yellow-darker);
    }
    .logo span {
      color: var(--text);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .nav-links a {
      padding: 4px 0;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      border-bottom-color: var(--yellow);
      color: var(--yellow-darker);
    }

    .nav-links a.active {
      border-bottom-color: var(--yellow-dark);
    }

    /* Mobile menu toggle */
    .menu-toggle {
      display: none;
      font-size: 1.6rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* ============================================================
       MAIN CONTENT (pages are injected here)
       ============================================================ */
    #main-content {
      min-height: 60vh;
      padding: 40px 0 60px;
    }

    /* ============================================================
       PAGE: HOME
       ============================================================ */
    .hero {
      text-align: center;
      padding: 20px 0 30px;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .hero h1 span {
      color: var(--yellow-darker);
      background: var(--yellow-light);
      padding: 0 12px;
      border-radius: 12px;
      display: inline-block;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 640px;
      margin: 0 auto 24px;
    }

    /* Search bar */
    .search-wrapper {
      max-width: 500px;
      margin: 0 auto 20px;
    }
    .search-wrapper input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid var(--border);
      border-radius: 50px;
      font-size: 1rem;
      background: white;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .search-wrapper input:focus {
      outline: none;
      border-color: var(--yellow-dark);
      box-shadow: 0 0 0 4px rgba(255, 219, 16, 0.2);
    }

    /* Article Grid */
    .section-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 40px 0 20px;
      color: var(--text);
    }
    .section-title small {
      font-weight: 400;
      color: var(--muted);
      font-size: 1rem;
      margin-left: 12px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: 0.25s ease;
      box-shadow: var(--shadow);
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .card-image {
      height: 180px;
      overflow: hidden;
      background: #f0f0f0;
    }
    .card-image img {
      height: 100%;
      transition: transform 0.5s ease;
    }
    .card:hover .card-image img {
      transform: scale(1.04);
    }

    .card-body {
      padding: 18px 20px 22px;
    }
    .card-body .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--yellow-darker);
      background: var(--yellow-light);
      padding: 2px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .card-body h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .card-body p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 14px;
    }
    .card-body .affiliate-link {
      font-weight: 700;
      color: var(--yellow-darker);
      border-bottom: 2px solid transparent;
      transition: 0.15s;
    }
    .card-body .affiliate-link:hover {
      border-bottom-color: var(--yellow-darker);
    }

    /* ============================================================
       PAGE: ABOUT / CONTACT (demo pages)
       ============================================================ */
    .page-content {
      max-width: 720px;
      margin: 0 auto;
    }
    .page-content h2 {
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .page-content p {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    footer {
      background: #0d1c26;
      color: #b0c4d0;
      padding: 48px 0 28px;
      margin-top: 20px;
    }
    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
    }
    .footer-brand .logo {
      color: var(--yellow);
    }
    .footer-brand .logo span {
      color: white;
    }
    .footer-brand p {
      max-width: 340px;
      margin-top: 8px;
      font-size: 0.9rem;
    }
    .footer-links {
      display: flex;
      gap: 48px;
      flex-wrap: wrap;
    }
    .footer-links h4 {
      color: white;
      margin-bottom: 8px;
    }
    .footer-links ul {
      list-style: none;
    }
    .footer-links li {
      margin: 4px 0;
      font-size: 0.9rem;
    }
    .footer-links a:hover {
      color: white;
    }
    .copyright {
      border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: 32px;
      padding-top: 20px;
      font-size: 0.8rem;
      text-align: center;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 700px) {
      .menu-toggle {
        display: block;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: var(--nav-height);
        left: 0;
        right: 0;
        background: white;
        padding: 24px;
        border-bottom: 2px solid var(--yellow);
        gap: 16px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.06);
      }
      .nav-links.open {
        display: flex;
      }
      .card-grid {
        grid-template-columns: 1fr 1fr;
      }
      .footer-inner {
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
      .hero h1 {
        font-size: 2rem;
      }
    }

    /* Utilities */
    .hidden {
      display: none !important;
    }
    .loading-spinner {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-size: 1.1rem;
    }
  </style>
</head>

<body>

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header>
    <div class="container nav">
      <a href="#" class="logo" onclick="navigateTo('home'); return false;">
        WORLD<span>DISCOVERY</span>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="#" class="active" data-page="home" onclick="navigateTo('home'); return false;">Home</a>
        <a href="#" data-page="about" onclick="navigateTo('about'); return false;">About</a>
        <a href="#" data-page="contact" onclick="navigateTo('contact'); return false;">Contact</a>
      </nav>

      <button class="menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">
        ☰
      </button>
    </div>
  </header>

  <!-- ============================================================
       MAIN CONTENT (pages are rendered here)
  ============================================================ -->
  <main id="main-content">
    <!-- The homepage will be injected here by JavaScript -->
  </main>

  <!-- ============================================================
       FOOTER
  ============================================================ -->
  <footer>
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <div class="logo">WORLD<span>DISCOVERY</span></div>
          <p>Explore amazing places, hidden gems, and fascinating travel stories from around the globe.</p>
        </div>
        <div class="footer-links">
          <div>
            <h4>Explore</h4>
            <ul>
              <li><a href="#" onclick="navigateTo('home'); return false;">Home</a></li>
              <li><a href="#" onclick="navigateTo('about'); return false;">About</a></li>
              <li><a href="#" onclick="navigateTo('contact'); return false;">Contact</a></li>
            </ul>
          </div>
        </div>
      </div>
      <div class="copyright">
        &copy; 2026 World Discovery. Explore something new.
      </div>
    </div>
  </footer>

  <!-- ============================================================
       SCRIPTS
  ============================================================ -->
  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script>
    /* ============================================================
       SUPABASE INIT
    ============================================================ */
    const SUPABASE_URL = 'https://kabvjgnbxgwlltzrkxsj.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYnZqZ25ieGd3bGx0enJreHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMjQ2NTQsImV4cCI6MjEwMTkwMDY1NH0.lJdkSERv8dwhMvCMUWLRe6mpC66SzAi_jXFcWJJ_Qng';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ============================================================
       SIMPLE SPA ROUTER (provision for more pages)
    ============================================================ */

    // Define your pages here. To add a new page, add a new key (e.g., 'gallery') 
    // and write its HTML content as a string.
    const pages = {
      home: `
          <div class="container">
            <div class="hero">
              <h1>Discover the <span>world</span> differently.</h1>
              <p>Amazing places, hidden destinations, and fascinating facts — all in one place.</p>
              <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search articles… (e.g., 'island')" oninput="filterArticles()" />
              </div>
            </div>

            <h2 class="section-title">Latest Articles <small>from our collection</small></h2>
            <div class="card-grid" id="articlesGrid">
              <div class="loading-spinner">Loading articles…</div>
            </div>
          </div>
        `,

      about: `
          <div class="container page-content">
            <h2>About Us</h2>
            <p>World Discovery was born from a simple love for travel and curiosity about our planet. We share hidden gems, surreal landscapes, and fascinating facts that make our world so special.</p>
            <p>Our mission is to inspire you to explore — whether from your armchair or on your next adventure. All content is carefully researched and written with passion.</p>
            <p>📧 hello@worlddiscovery.com</p>
          </div>
        `,

      contact: `
          <div class="container page-content">
            <h2>Contact</h2>
            <p>We'd love to hear from you! Whether you have a question, a travel tip, or just want to say hello, feel free to reach out.</p>
            <p>Email: <strong>hello@worlddiscovery.com</strong></p>
            <p>Social: @worlddiscovery (coming soon)</p>
          </div>
        `
    };

    // Keep track of the current page
    let currentPage = 'home';

    // Navigate to a page by its key
    function navigateTo(pageKey) {
      if (!pages[pageKey]) return;

      currentPage = pageKey;
      const main = document.getElementById('main-content');
      main.innerHTML = pages[pageKey];

      // Update active nav link
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.classList.toggle('active', link.dataset.page === pageKey);
      });

      // If we navigated to home, load the articles
      if (pageKey === 'home') {
        loadArticles();
      }

      // Close mobile menu if open
      document.getElementById('navLinks').classList.remove('open');
    }

    // Toggle mobile menu
    function toggleMobileMenu() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    /* ============================================================
       IP GEOLOCATION (cached)
    ============================================================ */
    async function getCountryCode() {
      try {
        const cached = localStorage.getItem('userCountry');
        const cachedTime = localStorage.getItem('userCountryTimestamp');
        if (cached && cachedTime) {
          const age = Date.now() - parseInt(cachedTime, 10);
          if (age < 3600000) return cached;
        }
      } catch (_) { /* ignore */ }

      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        if (data && data.country_code) {
          const country = data.country_code;
          try {
            localStorage.setItem('userCountry', country);
            localStorage.setItem('userCountryTimestamp', String(Date.now()));
          } catch (_) { /* ignore */ }
          return country;
        }
      } catch (_) { /* ignore */ }

      try {
        const res = await fetch('https://ip-api.com/json/');
        const data = await res.json();
        if (data && data.status === 'success' && data.countryCode) {
          const country = data.countryCode;
          try {
            localStorage.setItem('userCountry', country);
            localStorage.setItem('userCountryTimestamp', String(Date.now()));
          } catch (_) { /* ignore */ }
          return country;
        }
      } catch (_) { /* ignore */ }

      return 'default';
    }

    /* ============================================================
       LOAD ARTICLES FROM SUPABASE
    ============================================================ */
    async function loadArticles() {
      const grid = document.getElementById('articlesGrid');
      if (!grid) return;

      grid.innerHTML = '<div class="loading-spinner">Loading articles…</div>';

      try {
        // 1. Fetch all articles, newest first
        const { data: articles, error } = await supabaseClient
          .from('articles')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          grid.innerHTML = `<p style="color: var(--muted); padding: 20px;">⚠️ Could not load articles.</p>`;
          console.error('Supabase error:', error);
          return;
        }

        if (!articles || articles.length === 0) {
          grid.innerHTML = `<p style="color: var(--muted); padding: 20px;">No articles published yet. Check back soon!</p>`;
          return;
        }

        // 2. Fetch affiliate links for these articles based on user's country
        const country = await getCountryCode();
        const articleIds = articles.map(a => a.id);

        const { data: linkData, error: linkError } = await supabaseClient
          .from('affiliate_links')
          .select('article_id, link_url, country_code')
          .in('article_id', articleIds)
          .or(`country_code.eq.${country},country_code.eq.default`);

        if (linkError) console.warn('Affiliate link fetch error:', linkError);

        // Build map: article_id -> best link (country-specific over default)
        const linkMap = {};
        if (linkData) {
          linkData.forEach(item => {
            const existing = linkMap[item.article_id];
            if (!existing || (item.country_code !== 'default' && existing === 'default')) {
              linkMap[item.article_id] = item.link_url;
            }
          });
        }

        // 3. Render cards
        let html = '';
        articles.forEach(article => {
          const link = linkMap[article.id] || null;
          html += `
              <article class="card" data-title="${article.title.toLowerCase()}" data-tag="${(article.tag || '').toLowerCase()}">
                <div class="card-image">
                  <img src="${article.image_url}" alt="${article.title}" loading="lazy" />
                </div>
                <div class="card-body">
                  <span class="tag">${article.tag || 'Travel'}</span>
                  <h3>${article.title}</h3>
                  <p>${article.description}</p>
                  <a href="${link || '#'}" class="affiliate-link" target="_blank" rel="noopener">
                    ${link ? 'Check Price →' : 'Unavailable'}
                  </a>
                </div>
              </article>
            `;
        });

        grid.innerHTML = html;

      } catch (err) {
        console.error('Unexpected error:', err);
        grid.innerHTML = `<p style="color: var(--muted); padding: 20px;">⚠️ Something went wrong. Please refresh.</p>`;
      }
    }

    /* ============================================================
       SEARCH FILTER (client‑side)
    ============================================================ */
    function filterArticles() {
      const query = document.getElementById('searchInput')?.value.toLowerCase().trim() || '';
      const cards = document.querySelectorAll('#articlesGrid .card');
      cards.forEach(card => {
        const title = card.dataset.title || '';
        const tag = card.dataset.tag || '';
        const match = title.includes(query) || tag.includes(query);
        card.style.display = match ? '' : 'none';
      });
    }

    /* ============================================================
       START THE APP
    ============================================================ */

    // Load the home page by default when the DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
      navigateTo('home');
    });
  </script>

</body>
</html>
