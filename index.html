<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>World Discovery — Explore Amazing Places</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />

  <meta name="description" content="Discover amazing places, hidden destinations, and fascinating travel facts." />

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       COLOR SCHEME
       ============================================================ */
    :root {
      --yellow: #ffdb10;
      --yellow-dark: #e6c200;
      --yellow-darker: #b39b00;
      --yellow-light: #fff8e1;
      --bg: #fdfdfc;
      --surface: #ffffff;
      --text: #1a1a2e;
      --muted: #5a5a72;
      --border: #eaeaea;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
      --max-width: 1200px;
      --nav-height: 68px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ============================================================
       HEADER
       ============================================================ */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--yellow);
      height: var(--nav-height);
      display: flex;
      align-items: center;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--yellow-darker);
    }
    .logo span {
      color: var(--text);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .nav-links a {
      padding: 4px 0;
      border-bottom: 3px solid transparent;
      transition: 0.2s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      border-bottom-color: var(--yellow);
      color: var(--yellow-darker);
    }

    .nav-links a.active {
      border-bottom-color: var(--yellow-dark);
    }

    .menu-toggle {
      display: none;
      font-size: 1.6rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* ============================================================
       MAIN CONTENT
       ============================================================ */
    #main-content {
      min-height: 60vh;
      padding: 40px 0 60px;
    }

    /* ============================================================
       HOME PAGE
       ============================================================ */
    .hero {
      text-align: center;
      padding: 20px 0 30px;
    }

    .hero h1 {
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .hero h1 span {
      color: var(--yellow-darker);
      background: var(--yellow-light);
      padding: 0 12px;
      border-radius: 12px;
      display: inline-block;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 640px;
      margin: 0 auto 24px;
    }

    /* Search */
    .search-wrapper {
      max-width: 500px;
      margin: 0 auto 20px;
    }
    .search-wrapper input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid var(--border);
      border-radius: 50px;
      font-size: 1rem;
      background: white;
      transition: 0.2s;
    }
    .search-wrapper input:focus {
      outline: none;
      border-color: var(--yellow-dark);
      box-shadow: 0 0 0 4px rgba(255, 219, 16, 0.2);
    }

    /* Section Titles */
    .section-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 40px 0 20px;
      color: var(--text);
    }
    .section-title small {
      font-weight: 400;
      color: var(--muted);
      font-size: 1rem;
      margin-left: 12px;
    }

    /* Category Grid */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .category-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 16px;
      text-align: center;
      transition: 0.2s ease;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .category-card:hover {
      border-color: var(--yellow);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(255, 219, 16, 0.15);
    }
    .category-card .icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 8px;
    }
    .category-card .name {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .category-card .count {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Article Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: 0.25s ease;
      box-shadow: var(--shadow);
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .card-image {
      height: 180px;
      overflow: hidden;
      background: #f0f0f0;
    }
    .card-image img {
      height: 100%;
      transition: transform 0.5s ease;
    }
    .card:hover .card-image img {
      transform: scale(1.04);
    }

    .card-body {
      padding: 18px 20px 22px;
    }
    .card-body .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--yellow-darker);
      background: var(--yellow-light);
      padding: 2px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
    }
    .card-body h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .card-body p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 14px;
    }
    .card-body .affiliate-link {
      font-weight: 700;
      color: var(--yellow-darker);
      border-bottom: 2px solid transparent;
      transition: 0.15s;
    }
    .card-body .affiliate-link:hover {
      border-bottom-color: var(--yellow-darker);
    }

    /* Category Page Breadcrumb */
    .breadcrumb {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .breadcrumb a {
      color: var(--yellow-darker);
      font-weight: 600;
    }
    .breadcrumb a:hover {
      text-decoration: underline;
    }

    /* ============================================================
       PAGE: ABOUT / CONTACT
       ============================================================ */
    .page-content {
      max-width: 720px;
      margin: 0 auto;
    }
    .page-content h2 {
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .page-content p {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    footer {
      background: #0d1c26;
      color: #b0c4d0;
      padding: 48px 0 28px;
      margin-top: 20px;
    }
    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
    }
    .footer-brand .logo {
      color: var(--yellow);
    }
    .footer-brand .logo span {
      color: white;
    }
    .footer-brand p {
      max-width: 340px;
      margin-top: 8px;
      font-size: 0.9rem;
    }
    .footer-links {
      display: flex;
      gap: 48px;
      flex-wrap: wrap;
    }
    .footer-links h4 {
      color: white;
      margin-bottom: 8px;
    }
    .footer-links ul {
      list-style: none;
    }
    .footer-links li {
      margin: 4px 0;
      font-size: 0.9rem;
    }
    .footer-links a:hover {
      color: white;
    }
    .copyright {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 32px;
      padding-top: 20px;
      font-size: 0.8rem;
      text-align: center;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 700px) {
      .menu-toggle {
        display: block;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: var(--nav-height);
        left: 0;
        right: 0;
        background: white;
        padding: 24px;
        border-bottom: 2px solid var(--yellow);
        gap: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      }
      .nav-links.open {
        display: flex;
      }
      .card-grid {
        grid-template-columns: 1fr 1fr;
      }
      .category-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .footer-inner {
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
      .hero h1 {
        font-size: 2rem;
      }
      .category-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .hidden {
      display: none !important;
    }
    .loading-spinner {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-size: 1.1rem;
    }
    .back-home {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: var(--yellow);
      color: var(--text);
      font-weight: 700;
      border-radius: 30px;
      transition: 0.2s;
    }
    .back-home:hover {
      background: var(--yellow-dark);
    }
  </style>
</head>

<body>

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header>
    <div class="container nav">
      <a href="#" class="logo" onclick="navigateTo('home'); return false;">

      <nav class="nav-links" id="navLinks">

  <!-- ============================================================
       SCRIPTS
  ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script>
    /* ============================================================
       SUPABASE INIT
    ============================================================ */
    const SUPABASE_URL = 'https://kabvjgnbxgwlltzrkxsj.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthYnZqZ25ieGd3bGx0enJreHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMjQ2NTQsImV4cCI6MjEwMTkwMDY1NH0.lJdkSERv8dwhMvCMUWLRe6mpC66SzAi_jXFcWJJ_Qng';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ============================================================
       BOARD DEFINITIONS (20 Pinterest boards → category data)
    ============================================================ */
    const categories = [
      // Core Boards
      { id: 'amazing-places', name: 'Amazing Places Around the World', icon: '🏔️', tag: 'amazing-places' },
      { id: 'hidden-places', name: 'Hidden Places to Visit', icon: '🌿', tag: 'hidden-places' },
      { id: 'beautiful-places', name: 'Beautiful Places on Earth', icon: '🌅', tag: 'beautiful-places' },
      { id: 'bucket-list', name: 'Bucket List Destinations', icon: '✅', tag: 'bucket-list' },
      { id: 'unusual-places', name: 'Unusual Places Around the World', icon: '🌀', tag: 'unusual-places' },
      { id: 'dream-destinations', name: 'Dream Destinations', icon: '✨', tag: 'dream-destinations' },
      { id: 'travel-inspiration', name: 'World Travel Inspiration', icon: '🌟', tag: 'travel-inspiration' },
      { id: 'travel-tips', name: 'Travel Tips & Guides', icon: '📝', tag: 'travel-tips' },
      // Geographic Boards
      { id: 'europe', name: 'Europe Travel', icon: '🇪🇺', tag: 'europe' },
      { id: 'asia', name: 'Asia Travel', icon: '🌏', tag: 'asia' },
      { id: 'north-america', name: 'North America Travel', icon: '🇺🇸', tag: 'north-america' },
      { id: 'south-america', name: 'South America Travel', icon: '🌎', tag: 'south-america' },
      { id: 'africa', name: 'Africa Travel', icon: '🇿🇦', tag: 'africa' },
      { id: 'oceania', name: 'Australia & Oceania Travel', icon: '🇦🇺', tag: 'oceania' },
      { id: 'india', name: 'India Travel', icon: '🇮🇳', tag: 'india' },
      // Specialized Boards
      { id: 'world-maps', name: 'World Maps', icon: '🗺️', tag: 'world-maps' },
      { id: 'country-facts', name: 'Interesting Facts About Countries', icon: '📊', tag: 'country-facts' },
      { id: 'unreal-places', name: 'Places That Look Unreal', icon: '🌌', tag: 'unreal-places' },
      { id: 'hidden-gems', name: 'Hidden Travel Gems', icon: '💎', tag: 'hidden-gems' },
      { id: 'world-discovery', name: 'World Discovery', icon: '🌍', tag: 'world-discovery' }
    ];

    /* ============================================================
       SPA ROUTER
    ============================================================ */
    const pages = {
      home: `
          <div class="container">
            <div class="hero">
              <h1>Discover the <span>world</span> differently.</h1>
              <p>Amazing places, hidden destinations, and fascinating facts — all in one place.</p>
              <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search articles… (e.g., 'island')" oninput="filterArticles()" />
              </div>
            </div>

            <h2 class="section-title">Explore by Category <small>20 boards to inspire you</small></h2>
            <div class="category-grid" id="categoryGrid">
              ${categories.map(cat => `
                <div class="category-card" onclick="navigateToCategory('${cat.id}')">
                  <span class="icon">${cat.icon}</span>
                  <div class="name">${cat.name}</div>
                  <div class="count" id="count-${cat.id}">Loading…</div>
                </div>
              `).join('')}
            </div>

            <h2 class="section-title">Featured Articles <small>handpicked for you</small></h2>
            <div class="card-grid" id="featuredGrid">
              <div class="loading-spinner">Loading featured articles…</div>
            </div>

            <h2 class="section-title">Latest from Our Boards <small>fresh discoveries</small></h2>
            <div class="card-grid" id="latestGrid">
              <div class="loading-spinner">Loading latest articles…</div>
            </div>
          </div>
        `,

      category: `
          <div class="container">
            <div class="breadcrumb">
              <a href="#" onclick="navigateTo('home'); return false;">← Home</a> / <span id="categoryName">Category</span>
            </div>
            <h2 class="section-title" id="categoryTitle">Category</h2>
            <p style="color: var(--muted); margin-bottom: 20px;" id="categoryDescription">Explore articles in this category.</p>
            <div class="card-grid" id="categoryGrid">
              <div class="loading-spinner">Loading articles…</div>
            </div>
            <a href="#" class="back-home" onclick="navigateTo('home'); return false;">← Back to Home</a>
          </div>
        `,

      about: `
          <div class="container page-content">
            <h2>About Us</h2>
            <p>World Discovery was born from a simple love for travel and curiosity about our planet. We share hidden gems, surreal landscapes, and fascinating facts that make our world so special.</p>
            <p>Our mission is to inspire you to explore — whether from your armchair or on your next adventure. All content is carefully researched and written with passion.</p>
            <p>📧 hello@worlddiscovery.com</p>
          </div>
        `,

      contact: `
          <div class="container page-content">
            <h2>Contact</h2>
            <p>We'd love to hear from you! Whether you have a question, a travel tip, or just want to say hello, feel free to reach out.</p>
            <p>Email: <strong>hello@worlddiscovery.com</strong></p>
            <p>Social: @worlddiscovery (coming soon)</p>
          </div>
        `
    };

    let currentPage = 'home';
    let currentCategoryId = null;
    let allArticles = [];

    function navigateTo(pageKey) {
      if (!pages[pageKey]) return;

      currentPage = pageKey;
      currentCategoryId = null;

      const main = document.getElementById('main-content');
      main.innerHTML = pages[pageKey];

      // Update active nav link
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.classList.toggle('active', link.dataset.page === pageKey);
      });

      // Load appropriate content
      if (pageKey === 'home') {
        loadCategoryCounts();
        loadFeaturedArticles();
        loadLatestArticles();
      }

      document.getElementById('navLinks').classList.remove('open');
    }

    function navigateToCategory(categoryId) {
      const category = categories.find(c => c.id === categoryId);
      if (!category) return;

      currentCategoryId = categoryId;
      currentPage = 'category';

      const main = document.getElementById('main-content');
      main.innerHTML = pages.category;

      // Update breadcrumb and title
      document.getElementById('categoryName').textContent = category.name;
      document.getElementById('categoryTitle').textContent = `${category.icon} ${category.name}`;
      document.getElementById('categoryDescription').textContent = `Articles tagged with "${category.name}".`;

      // Load articles for this category
      loadCategoryArticles(category.tag);

      // Update nav
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.classList.toggle('active', link.dataset.page === 'home');
      });

      document.getElementById('navLinks').classList.remove('open');
    }

    function toggleMobileMenu() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    /* ============================================================
       IP GEOLOCATION
    ============================================================ */
    async function getCountryCode() {
      try {
        const cached = localStorage.getItem('userCountry');
        const cachedTime = localStorage.getItem('userCountryTimestamp');
        if (cached && cachedTime) {
          const age = Date.now() - parseInt(cachedTime, 10);
          if (age < 3600000) return cached;
        }
      } catch (_) {}

      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        if (data && data.country_code) {
          const country = data.country_code;
          try {
            localStorage.setItem('userCountry', country);
            localStorage.setItem('userCountryTimestamp', String(Date.now()));
          } catch (_) {}
          return country;
        }
      } catch (_) {}

      try {
        const res = await fetch('https://ip-api.com/json/');
        const data = await res.json();
        if (data && data.status === 'success' && data.countryCode) {
          const country = data.countryCode;
          try {
            localStorage.setItem('userCountry', country);
            localStorage.setItem('userCountryTimestamp', String(Date.now()));
          } catch (_) {}
          return country;
        }
      } catch (_) {}

      return 'default';
    }

    /* ============================================================
       RENDER CARDS
    ============================================================ */
    function createCardHTML(article, linkUrl) {
      return `
        <article class="card" data-title="${article.title.toLowerCase()}" data-tag="${(article.tag || '').toLowerCase()}">
          <div class="card-image">
            <img src="${article.image_url}" alt="${article.title}" loading="lazy" />
          </div>
          <div class="card-body">
            <span class="tag">${article.tag || 'Travel'}</span>
            <h3>${article.title}</h3>
            <p>${article.description}</p>
            <a href="${linkUrl || '#'}" class="affiliate-link" target="_blank" rel="noopener">
              ${linkUrl ? 'Check Price →' : 'Unavailable'}
            </a>
          </div>
        </article>
      `;
    }

    /* ============================================================
       LOAD CATEGORY COUNTS (for homepage category grid)
    ============================================================ */
    async function loadCategoryCounts() {
      try {
        const { data, error } = await supabaseClient
          .from('articles')
          .select('tag');

        if (error || !data) return;

        // Count articles per tag
        const counts = {};
        data.forEach(article => {
          if (article.tag) {
            counts[article.tag] = (counts[article.tag] || 0) + 1;
          }
        });

        // Update the UI
        categories.forEach(cat => {
          const el = document.getElementById(`count-${cat.id}`);
          if (el) {
            const count = counts[cat.tag] || 0;
            el.textContent = `${count} article${count !== 1 ? 's' : ''}`;
          }
        });

      } catch (err) {
        console.error('Error loading counts:', err);
      }
    }

    /* ============================================================
       LOAD FEATURED ARTICLES (homepage)
    ============================================================ */
    async function loadFeaturedArticles() {
      const grid = document.getElementById('featuredGrid');
      if (!grid) return;

      grid.innerHTML = '<div class="loading-spinner">Loading featured articles…</div>';

      try {
        const { data: articles, error } = await supabaseClient
          .from('articles')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(4);

        if (error || !articles || articles.length === 0) {
          grid.innerHTML = `<p style="color: var(--muted); padding: 20px;">No featured articles yet.</p>`;
          return;
        }

        const country = await getCountryCode();
        const articleIds = articles.map(a => a.id);

        const { data: linkData } = await supabaseClient
          .from('affiliate_links')
          .select('article_id, link_url, country_code')
          .in('article_id', articleIds)
          .or(`country_code.eq.${country},country_code.eq.default`);

        const linkMap = {};
        if (linkData) {
          linkData.forEach(item => {
            const existing = linkMap[item.article_id];
            if (!existing || (item.country_code !== 'default' && existing === 'default')) {
              linkMap[item.article_id] = item.link_url;
            }
          });
        }

        let html = '';
        articles.forEach(article => {
          const link = linkMap[article.id] || null;
          html += createCardHTML(article, link);
        });

        grid.innerHTML = html;

      } catch (err) {
        console.error('Error loading featured:', err);
        grid.innerHTML = `<p style="color: var(--muted); padding: 20px;">⚠️ Could not load featured articles.</p>`;
      }
    }

    /* ============================================================
       SEARCH FILTER
    ============================================================ */
    function filterArticles() {
      const query = document.getElementById('searchInput')?.value.toLowerCase().trim() || '';
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const title = card.dataset.title || '';
        const tag = card.dataset.tag || '';
        const match = title.includes(query) || tag.includes(query);
        card.style.display = match ? '' : 'none';
      });
    }

    /* ============================================================
       START THE APP
    ============================================================ */
    document.addEventListener('DOMContentLoaded', () => {
      navigateTo('home');
