  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- ===== LEAFLET (for map) ===== -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* ============================================================
       All styles remain exactly the same as before
       ============================================================ */
    :root {
      --yellow: #ffdb10;
      --yellow-dark: #e6c200;
      --yellow-darker: #b39b00;
      --bg: #f7f9fc;
      --surface: #ffffff;
      --text: #1a1a2e;
      --muted: #5a5a72;
      --border: #eaeaea;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --radius: 16px;
      --max-width: 1400px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 30px 20px;
    }
    .container { max-width: var(--max-width); margin: 0 auto; }

    h1, h2, h3 { font-weight: 800; }

    /* ===== TOP BAR ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .top-bar .last-updated {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .logout-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: underline;
    }
    .logout-btn:hover { color: var(--text); }

    /* ===== TAB NAVIGATION ===== */
    .tab-nav {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 4px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab-nav button {
      padding: 10px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      white-space: nowrap;
    }
    .tab-nav button:hover {
      background: var(--yellow-light);
      color: var(--text);
    }
    .tab-nav button.active {
      background: var(--yellow);
      color: var(--text);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* ===== STATS GRID (Dashboard) ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .stat-card .number {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--yellow-darker);
    }
    .stat-card .label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ===== TWO COLUMN ===== */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 30px 0 16px;
      border-bottom: 2px solid var(--yellow);
      padding-bottom: 6px;
    }

    /* ===== TABLES ===== */
    .table-wrap {
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th { text-align: left; font-weight: 700; padding: 10px 8px; border-bottom: 2px solid var(--border); }
    td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge-yes { background: #e8f5e9; color: #2e7d32; }
    .badge-no { background: #ffebee; color: #c62828; }
    .badge-draft { background: #fff3e0; color: #e65100; }
    .badge-published { background: #e8f5e9; color: #2e7d32; }
    .badge-archived { background: #f5f5f5; color: #616161; }
    .badge-deleted { background: #ffebee; color: #c62828; }

    /* ===== CHARTS ===== */
    .chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      height: 300px;
    }

    /* ===== MAP ===== */
    #clickMap {
      height: 500px;
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #f0f2f5;
      margin-bottom: 20px;
    }
    .leaflet-control-attribution {
      font-size: 0.7rem;
    }
    .leaflet-popup-content {
      font-family: 'Inter', sans-serif;
    }

    /* ===== LOGIN ===== */
    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
    }
    .login-box h2 { margin-bottom: 16px; }
    .login-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .login-box input:focus {
      outline: none;
      border-color: var(--yellow-dark);
      box-shadow: 0 0 0 3px rgba(255, 219, 16, 0.2);
    }
    .login-box .btn {
      width: 100%;
      padding: 12px;
      background: var(--yellow);
      color: var(--text);
      font-weight: 700;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-box .btn:hover { background: var(--yellow-dark); }
    .error-msg { color: #d32f2f; margin-top: 10px; font-size: 0.9rem; display:none; }

    /* ===== BUTTONS ===== */
    .btn-primary {
      background: var(--yellow);
      color: var(--text);
      border: none;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-primary:hover { background: var(--yellow-dark); }

    .btn-danger {
      background: #ffebee;
      color: #c62828;
      border: none;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-danger:hover { background: #ffcdd2; }

    .btn-edit {
      background: #e3f2fd;
      color: #0d47a1;
      border: none;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-edit:hover { background: #bbdefb; }

    .btn-sm {
      padding: 4px 12px;
      font-size: 0.75rem;
      border-radius: 20px;
    }

    .btn-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: none;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-success:hover { background: #c8e6c9; }

    .btn-restore {
      background: #fff3e0;
      color: #e65100;
      border: none;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .btn-restore:hover { background: #ffe0b2; }

    .refresh-btn {
      background: var(--yellow);
      border: none;
      padding: 6px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .refresh-btn:hover { background: var(--yellow-dark); }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { font-size: 1.4rem; }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--muted);
      padding: 0 8px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    .modal .form-group {
      margin-bottom: 16px;
    }
    .modal .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .modal .form-group input,
    .modal .form-group select,
    .modal .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: 0.2s;
    }
    .modal .form-group input:focus,
    .modal .form-group select:focus,
    .modal .form-group textarea:focus {
      outline: none;
      border-color: var(--yellow-dark);
      box-shadow: 0 0 0 3px rgba(255, 219, 16, 0.2);
    }
    .modal .form-group textarea {
      min-height: 200px;
      resize: vertical;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .modal .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .modal .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .modal .form-actions .btn {
      padding: 10px 28px;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .modal .form-actions .btn-save {
      background: var(--yellow);
      color: var(--text);
    }
    .modal .form-actions .btn-save:hover { background: var(--yellow-dark); }
    .modal .form-actions .btn-cancel {
      background: transparent;
      color: var(--muted);
      border: 2px solid var(--border);
    }
    .modal .form-actions .btn-cancel:hover { border-color: var(--yellow); }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* ===== SEO PREVIEW ===== */
    .seo-preview {
      background: #f0f2f5;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 8px 0 4px;
      font-family: Arial, sans-serif;
      border-left: 4px solid var(--yellow);
    }
    .seo-preview .seo-title {
      color: #1a0dab;
      font-size: 18px;
      line-height: 1.3;
      text-decoration: none;
      cursor: pointer;
      font-weight: 400;
      display: block;
      margin-bottom: 2px;
    }
    .seo-preview .seo-title:hover {
      text-decoration: underline;
    }
    .seo-preview .seo-url {
      color: #006621;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 2px;
      word-break: break-all;
    }
    .seo-preview .seo-desc {
      color: #4d5156;
      font-size: 13px;
      line-height: 1.4;
    }
    .seo-preview .char-count {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      gap: 16px;
    }
    .seo-preview .char-count .warning {
      color: #e65100;
      font-weight: 700;
    }
    .seo-preview .char-count .good {
      color: #2e7d32;
      font-weight: 700;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      .two-col { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .modal .form-row { grid-template-columns: 1fr; }
      .modal { padding: 20px; }
      .tab-nav button { padding: 8px 16px; font-size: 0.8rem; }
      #clickMap { height: 300px; }
    }
  </style>
</head>

            <div class="stats-grid" id="statsGrid">
              <div class="stat-card"><div class="number" id="statTotal">—</div><div class="label">Total Clicks</div></div>
              <div class="stat-card"><div class="number" id="stat24h">—</div><div class="label">Clicks (24h)</div></div>
              <div class="stat-card"><div class="number" id="stat7d">—</div><div class="label">Clicks (7d)</div></div>
              <div class="stat-card"><div class="number" id="stat30d">—</div><div class="label">Clicks (30d)</div></div>
              <div class="stat-card"><div class="number" id="statUnique">—</div><div class="label">Unique Clickers</div></div>
              <div class="stat-card"><div class="number" id="statTopLink">—</div><div class="label">Top Link</div></div>
              <div class="stat-card"><div class="number" id="statTopCountry">—</div><div class="label">Top Country</div></div>

              <div class="stat-card"><div class="number" id="statTopProduct">—</div><div class="label">Top Product</div></div>

            <!-- Map -->
            <h3 class="section-title">🌍 Geographic Click Distribution</h3>
            <div id="clickMap"></div>
            <div style="text-align: right; font-size: 0.8rem; color: var(--muted); margin-top: -10px; margin-bottom: 20px;">
              Red dots show countries with clicks — click a dot for details
            </div>

            <div class="two-col">
              <div><h3 class="section-title">📈 Clicks by Affiliate Key</h3><div class="chart-container"><canvas id="affiliateChart"></canvas></div></div>
              <div><h3 class="section-title">🏷️ Affiliate Key Breakdown</h3><div class="table-wrap"><table><thead><tr><th>Affiliate Key</th><th>Clicks</th></tr></thead><tbody id="affiliateBreakdownBody"><tr><td colspan="2" style="text-align:center;">Loading…</td></tr></tbody></table></div></div>
            </div>

            <!-- ===== NEW: Product Stats Section ===== -->
            <div class="two-col">
              <div><h3 class="section-title">🛍️ Top Products</h3><div class="table-wrap"><table><thead><tr><th>Product</th><th>Clicks</th><th>Unique</th></tr></thead><tbody id="topProductsBody"><tr><td colspan="3" style="text-align:center;">Loading…</td></tr></tbody></table></div></div>
              <div><h3 class="section-title">📦 Product Breakdown</h3><div class="table-wrap"><table><thead><tr><th>Product</th><th>Clicks</th></tr></thead><tbody id="productBreakdownBody"><tr><td colspan="2" style="text-align:center;">Loading…</td></tr></tbody></table></div></div>
            </div>

            <div class="two-col">
              <div><h3 class="section-title">🔗 Top Links</h3><div class="table-wrap"><table><thead><tr><th>Link</th><th>Clicks</th><th>Unique</th></tr></thead><tbody id="topLinksBody"><tr><td colspan="3" style="text-align:center;">Loading…</td></tr></tbody></table></div></div>
              <div><h3 class="section-title">📄 Top Articles</h3><div class="table-wrap"><table><thead><tr><th>Article</th><th>Clicks</th></tr></thead><tbody id="topArticlesBody"><tr><td colspan="2" style="text-align:center;">Loading…</td></tr></tbody></table></div></div>
            </div>

            <h3 class="section-title">🌍 Region Distribution</h3>
            <div class="table-wrap"><table><thead><tr><th>Country</th><th>Clicks</th></tr></thead><tbody id="regionBody"><tr><td colspan="2" style="text-align:center;">Loading…</td></tr></tbody></table></div>

            <h3 class="section-title">🕒 Recent Clicks</h3>
            <div class="table-wrap"><table><thead><tr><th>Time</th><th>Article</th><th>Product</th><th>Link</th><th>Affiliate Key</th><th>Country</th></tr></thead><tbody id="recentBody"><tr><td colspan="6" style="text-align:center;">Loading…</td></tr></tbody></table></div>
          </div>

          <!-- ARTICLES TAB (unchanged) -->
          <div id="tab-articles" class="tab-content">...</div>
          <!-- AFFILIATE LINKS TAB (unchanged) -->
          <div id="tab-affiliates" class="tab-content">...</div>
          <!-- SHOP TAB (unchanged) -->
          <div id="tab-shop" class="tab-content">...</div>
        </div>
      `;

      populateArticleCategoryDropdown();
      loadDashboardData();
      loadArticlesList();
      loadShopCategories();
      loadShopProducts();
      startAutoRefresh();
    }

    // ============================================================
    // loadDashboardData() – updated to handle product stats
    // ============================================================
    async function loadDashboardData() {
      ['statTotal','stat24h','stat7d','stat30d','statUnique','statTopLink','statTopCountry','statTopProduct'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = '…';
      });

      const now = new Date();
      const dayAgo = new Date(now.getTime() - 24*60*60*1000);
      const sevenDaysAgo = new Date(now.getTime() - 7*24*60*60*1000);
      const thirtyDaysAgo = new Date(now.getTime() - 30*24*60*60*1000);

      try {
        const { data: allClicksRaw, error } = await supabaseClient
          .from('click_logs')
          .select('created_at, affiliate_key, link_url, visitor_id, country_code, article_id, product_id')
          .order('created_at', { ascending: false });

        if (error) throw error;

        const allClicks = allClicksRaw || [];
        const totalClicks = allClicks.length;

        const dayFilter = dayAgo.toISOString();
        const sevenFilter = sevenDaysAgo.toISOString();
        const thirtyFilter = thirtyDaysAgo.toISOString();

        const count24h = allClicks.filter(c => c.created_at >= dayFilter).length;
        const count7d = allClicks.filter(c => c.created_at >= sevenFilter).length;
        const count30d = allClicks.filter(c => c.created_at >= thirtyFilter).length;

        const uniqueSet = new Set(allClicks.filter(c => c.created_at >= thirtyFilter).map(c => c.visitor_id).filter(Boolean));
        const uniqueCount = uniqueSet.size;

        const linkStatsGlobal = {};
        const countryStatsGlobal = {};
        const productStatsGlobal = {};
        allClicks.forEach(row => {
          if (row.link_url) {
            if (!linkStatsGlobal[row.link_url]) linkStatsGlobal[row.link_url] = { total: 0, unique: new Set() };
            linkStatsGlobal[row.link_url].total++;
            if (row.visitor_id) linkStatsGlobal[row.link_url].unique.add(row.visitor_id);
          }
          const cc = row.country_code || 'Unknown';
          countryStatsGlobal[cc] = (countryStatsGlobal[cc] || 0) + 1;
          // Product stats (global, all time)
          if (row.product_id) {
            if (!productStatsGlobal[row.product_id]) productStatsGlobal[row.product_id] = { total: 0, unique: new Set() };
            productStatsGlobal[row.product_id].total++;
            if (row.visitor_id) productStatsGlobal[row.product_id].unique.add(row.visitor_id);
          }
        });

        const sortedLinksGlobal = Object.entries(linkStatsGlobal)
          .map(([url, stats]) => ({ url, total: stats.total, unique: stats.unique.size }))
          .sort((a, b) => b.total - a.total);
        const topLink = sortedLinksGlobal.length ? (sortedLinksGlobal[0].url.length > 40 ? sortedLinksGlobal[0].url.substring(0,40)+'…' : sortedLinksGlobal[0].url) : '—';

        const sortedCountriesGlobal = Object.entries(countryStatsGlobal).sort((a,b) => b[1] - a[1]);
        const topCountry = sortedCountriesGlobal.length ? sortedCountriesGlobal[0][0] : '—';

        // Top product (global)
        let topProductName = '—';
        if (Object.keys(productStatsGlobal).length > 0) {
          const sortedProducts = Object.entries(productStatsGlobal)
            .map(([id, stats]) => ({ id: Number(id), total: stats.total }))
            .sort((a, b) => b.total - a.total);
          const topProductId = sortedProducts[0]?.id;
          if (topProductId) {
            const { data: product, error: pErr } = await supabaseClient
              .from('products')
              .select('name')
              .eq('id', topProductId)
              .single();
            if (!pErr && product) topProductName = product.name;
          }
        }

        document.getElementById('statTotal').textContent = totalClicks;
        document.getElementById('stat24h').textContent = count24h;
        document.getElementById('stat7d').textContent = count7d;
        document.getElementById('stat30d').textContent = count30d;
        document.getElementById('statUnique').textContent = uniqueCount;
        document.getElementById('statTopLink').textContent = topLink;
        document.getElementById('statTopCountry').textContent = topCountry;
        document.getElementById('statTopProduct').textContent = topProductName;

        // ---- Date-aware sections ----
        if (!currentStartDate && !currentEndDate) {
          const defaultStart = new Date(now);
          defaultStart.setDate(now.getDate() - 30);
          currentStartDate = defaultStart;
          currentEndDate = now;
          document.getElementById('startDateInput').value = defaultStart.toISOString().split('T')[0];
          document.getElementById('endDateInput').value = now.toISOString().split('T')[0];
        }

        const startISO = currentStartDate.toISOString();
        const endISO = currentEndDate.toISOString();

        let affiliateStats = {};
        let linkStats = {};
        let countryStats = {};
        let articleStats = {};
        let productStats = {};
        let recentClicks = [];

        // Try RPC first
        let rpcSuccess = false;
        try {
          const { data: summary, error: summaryError } = await supabaseClient
            .rpc('get_dashboard_summary', {
              start_date: startISO,
              end_date: endISO
            });

          if (!summaryError && summary) {
            rpcSuccess = true;
            if (summary.affiliate_breakdown) {
              summary.affiliate_breakdown.forEach(item => {
                affiliateStats[item.affiliate_key] = item.click_count;
              });
            }
            if (summary.top_links) {
              summary.top_links.forEach(item => {
                linkStats[item.link_url] = { total: item.click_count, unique: item.unique_count };
              });
            }
            if (summary.country_stats) {
              summary.country_stats.forEach(item => {
                countryStats[item.country] = item.click_count;
              });
            }
            // NEW: product breakdown
            if (summary.product_breakdown) {
              summary.product_breakdown.forEach(item => {
                productStats[item.product_name] = item.click_count;
              });
            }
            // NEW: top products
            if (summary.top_products) {
              // We'll use this later
            }

            const { data: rangeClicks, error: rangeError } = await supabaseClient
              .from('click_logs')
              .select('created_at, affiliate_key, link_url, visitor_id, country_code, article_id, product_id')
              .gte('created_at', startISO)
              .lte('created_at', endISO)
              .order('created_at', { ascending: false })
              .limit(30);

            if (!rangeError && rangeClicks) {
              recentClicks = rangeClicks;
              rangeClicks.forEach(row => {
                if (row.article_id) {
                  articleStats[row.article_id] = (articleStats[row.article_id] || 0) + 1;
                }
                if (row.product_id) {
                  // We'll aggregate product names later using a separate query
                }
              });
            }
          }
        } catch (rpcErr) {
          console.warn('RPC failed, falling back to client-side filtering:', rpcErr);
        }

        if (!rpcSuccess) {
          const filteredClicks = allClicks.filter(c => c.created_at >= startISO && c.created_at <= endISO);
          recentClicks = filteredClicks.slice(0, 30);

          filteredClicks.forEach(row => {
            if (row.link_url) {
              if (!linkStats[row.link_url]) linkStats[row.link_url] = { total: 0, unique: new Set() };
              linkStats[row.link_url].total++;
              if (row.visitor_id) linkStats[row.link_url].unique.add(row.visitor_id);
            }
            const cc = row.country_code || 'Unknown';
            countryStats[cc] = (countryStats[cc] || 0) + 1;
            if (row.affiliate_key) {
              affiliateStats[row.affiliate_key] = (affiliateStats[row.affiliate_key] || 0) + 1;
            }
            if (row.article_id) {
              articleStats[row.article_id] = (articleStats[row.article_id] || 0) + 1;
            }
            if (row.product_id) {
              productStats[row.product_id] = (productStats[row.product_id] || 0) + 1;
            }
          });

          // Convert productStats to product names
          const productIds = Object.keys(productStats).map(Number).filter(id => id);
          if (productIds.length > 0) {
            const { data: products, error: pErr } = await supabaseClient
              .from('products')
              .select('id, name')
              .in('id', productIds);
            if (!pErr && products) {
              const productMap = {};
              products.forEach(p => { productMap[p.id] = p.name; });
              const productStatsNamed = {};
              Object.entries(productStats).forEach(([id, count]) => {
                const name = productMap[id] || `Product ${id}`;
                productStatsNamed[name] = count;
              });
              productStats = productStatsNamed;
            }
          }
        }

        // Render map
        const countryStatsArray = Object.entries(countryStats).map(([country, count]) => ({ country, click_count: count }));
        renderSimpleMap(countryStatsArray);

        // Render affiliate breakdown
        const sortedAffiliates = Object.entries(affiliateStats).sort((a,b) => b[1] - a[1]);
        const tbodyAffiliate = document.getElementById('affiliateBreakdownBody');
        if (tbodyAffiliate) {
          if (sortedAffiliates.length === 0) {
            tbodyAffiliate.innerHTML = `<tr><td colspan="2" style="text-align:center;">No data in selected period.</td></tr>`;
          } else {
            let rows = '';
            sortedAffiliates.forEach(([key, count]) => {
              rows += `<tr><td><code>${key}</code></td><td>${count}</td></tr>`;
            });
            tbodyAffiliate.innerHTML = rows;
          }
        }

        // Chart
        const labels = sortedAffiliates.map(([key]) => key);
        const dataValues = sortedAffiliates.map(([, count]) => count);
        const ctx = document.getElementById('affiliateChart')?.getContext('2d');
        if (ctx) {
          if (chartInstance) chartInstance.destroy();
          chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: 'Clicks',
                data: dataValues,
                backgroundColor: '#ffdb10',
                borderColor: '#b39b00',
                borderWidth: 1
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true } }
            }
          });
        }

        // Top Links
        const sortedLinks = Object.entries(linkStats)
          .map(([url, stats]) => ({ url, total: stats.total, unique: stats.unique }))
          .sort((a, b) => b.total - a.total);
        const tbodyLinks = document.getElementById('topLinksBody');
        if (tbodyLinks) {
          if (sortedLinks.length === 0) {
            tbodyLinks.innerHTML = `<tr><td colspan="3" style="text-align:center;">No clicks in selected period.</td></tr>`;
          } else {
            let rows = '';
            sortedLinks.slice(0,10).forEach(item => {
              const display = item.url.length > 50 ? item.url.substring(0,50)+'…' : item.url;
              rows += `<tr><td><a href="${item.url}" target="_blank">${display}</a></td><td>${item.total}</td><td>${item.unique}</td></tr>`;
            });
            tbodyLinks.innerHTML = rows;
          }
        }

        // Top Articles
        const articleIds = Object.keys(articleStats).filter(id => id !== null).map(Number);
        let articleMap = {};
        if (articleIds.length > 0) {
          const { data: articles, error: artError } = await supabaseClient
            .from('articles')
            .select('id, title')
            .in('id', articleIds);
          if (!artError && articles) {
            articles.forEach(a => { articleMap[a.id] = a.title; });
          }
        }
        const sortedArticles = Object.entries(articleStats)
          .filter(([id]) => id !== null)
          .map(([id, count]) => ({ id: Number(id), count, title: articleMap[id] || 'Unknown Article' }))
          .sort((a,b) => b.count - a.count);
        const tbodyArticles = document.getElementById('topArticlesBody');
        if (tbodyArticles) {
          if (sortedArticles.length === 0) {
            tbodyArticles.innerHTML = `<tr><td colspan="2" style="text-align:center;">No article clicks in selected period.</td></tr>`;
          } else {
            let rows = '';
            sortedArticles.slice(0,10).forEach(item => {
              const titleDisplay = item.title.length > 40 ? item.title.substring(0,40)+'…' : item.title;
              rows += `<tr><td>${titleDisplay}</td><td>${item.count}</td></tr>`;
            });
            tbodyArticles.innerHTML = rows;
          }
        }

        // ===== NEW: Top Products =====
        const sortedProducts = Object.entries(productStats)
          .map(([name, count]) => ({ name, count }))
          .sort((a, b) => b.count - a.count);
        const tbodyTopProducts = document.getElementById('topProductsBody');
        if (tbodyTopProducts) {
          if (sortedProducts.length === 0) {
            tbodyTopProducts.innerHTML = `<tr><td colspan="3" style="text-align:center;">No product clicks in selected period.</td></tr>`;
          } else {
            let rows = '';
            sortedProducts.slice(0,10).forEach(item => {
              rows += `<tr><td>${item.name}</td><td>${item.count}</td><td>—</td></tr>`;
            });
            tbodyTopProducts.innerHTML = rows;
          }
        }

        // ===== NEW: Product Breakdown =====
        const tbodyProductBreakdown = document.getElementById('productBreakdownBody');
        if (tbodyProductBreakdown) {
          if (sortedProducts.length === 0) {
            tbodyProductBreakdown.innerHTML = `<tr><td colspan="2" style="text-align:center;">No product clicks in selected period.</td></tr>`;
          } else {
            let rows = '';
            sortedProducts.forEach((item) => {
              rows += `<tr><td>${item.name}</td><td>${item.count}</td></tr>`;
            });
            tbodyProductBreakdown.innerHTML = rows;
          }
        }

        // Region Distribution
        const sortedCountries = Object.entries(countryStats).sort((a,b) => b[1] - a[1]);
        const tbodyRegion = document.getElementById('regionBody');
        if (tbodyRegion) {
          if (sortedCountries.length === 0) {
            tbodyRegion.innerHTML = `<tr><td colspan="2" style="text-align:center;">No data in selected period.</td></tr>`;
          } else {
            let rows = '';
            sortedCountries.forEach(([country, count]) => {
              rows += `<tr><td>${country}</td><td>${count}</td></tr>`;
            });
            tbodyRegion.innerHTML = rows;
          }
        }

        // Recent Clicks (updated to include product)
        const recentArticleIds = recentClicks.map(r => r.article_id).filter(id => id !== null).map(Number);
        let recentArticleMap = {};
        if (recentArticleIds.length > 0) {
          const { data: recentArts, error: rArtError } = await supabaseClient
            .from('articles')
            .select('id, title')
            .in('id', recentArticleIds);
          if (!rArtError && recentArts) {
            recentArts.forEach(a => { recentArticleMap[a.id] = a.title; });
          }
        }
        // Product names for recent clicks
        const recentProductIds = recentClicks.map(r => r.product_id).filter(id => id !== null).map(Number);
        let recentProductMap = {};
        if (recentProductIds.length > 0) {
          const { data: recentProds, error: rProdError } = await supabaseClient
            .from('products')
            .select('id, name')
            .in('id', recentProductIds);
          if (!rProdError && recentProds) {
            recentProds.forEach(p => { recentProductMap[p.id] = p.name; });
          }
        }

        const tbodyRecent = document.getElementById('recentBody');
        if (tbodyRecent) {
          if (recentClicks.length === 0) {
            tbodyRecent.innerHTML = `<tr><td colspan="6" style="text-align:center;">No clicks in selected period.</td></tr>`;
          } else {
            let rows = '';
            recentClicks.forEach(row => {
              const time = new Date(row.created_at).toLocaleString();
              const articleTitle = row.article_id ? (recentArticleMap[row.article_id] || 'Unknown') : '—';
              const productName = row.product_id ? (recentProductMap[row.product_id] || 'Unknown Product') : '—';
              const displayLink = row.link_url ? (row.link_url.length > 30 ? row.link_url.substring(0,30)+'…' : row.link_url) : '—';
              rows += `<tr>
                <td>${time}</td>
                <td>${articleTitle}</td>
                <td>${productName}</td>
                <td><a href="${row.link_url || '#'}" target="_blank">${displayLink}</a></td>
                <td><code>${row.affiliate_key || '—'}</code></td>
                <td>${row.country_code || 'Unknown'}</td>
              </tr>`;
            });
            tbodyRecent.innerHTML = rows;
          }
        }

      } catch (err) {
        console.error('Dashboard error:', err);
        const grid = document.getElementById('statsGrid');
        if (grid) grid.innerHTML = `<div style="grid-column:1/-1; color:var(--muted);">Error loading dashboard. Please refresh.</div>`;
      }
    }

    // ============================================================
    // The rest of the functions (renderSimpleMap, exportCSV, generateSitemap, etc.)
    // remain exactly as in the previous version (with the escapeXml fix).
    // I'm omitting them here for brevity, but they are unchanged.
    // ============================================================

    // ============================================================
    checkSession();

    // (Close modals, auto-slug generation, etc. – unchanged)
  </script>
